<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="p-3 bg-dark text-light">
            <h1 class="text-center">Calculadora de Touring</h1>
        </div>
    </header>
    <div class="row justify-content-center pt-3 mx-auto">
        <p class="col-1 m-0 px-0">Operación:</p>
        <label id="numUno" class="text-center col-1 text-light bg-secondary rounded"></label>
        <label id="ope" class="text-center col-1 text-light bg-secondary rounded"></label>
        <label id="numDos" class="text-center col-1 text-light bg-secondary rounded"></label>
        <button id="limpiar-b" class="col-1 btn btn-danger" onclick="limpiar()">DEL</button>
    </div>
    <div class="col-7 mx-auto">
        <div class="row justify-content-center gap-1 pt-1">
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('1')">1</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('2')">2</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('3')">3</button>
            <button type="button" class="btn btn-sm btn-light col-1" onclick="insertar('+')">+</button>
            <button type="button" class="btn btn-sm btn-light col-1" onclick="insertar('*')">*</button>
        </div>
        <div class="row justify-content-center gap-1 pt-1">
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('4')">4</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('5')">5</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('6')">6</button>
            <button type="button" class="btn btn-sm btn-light col-1" onclick="insertar('-')">-</button>
            <button type="button" class="btn btn-sm btn-light col-1" onclick="insertar('/')">/</button>
        </div>
        <div class="row justify-content-center gap-1 pt-1">
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('7')">7</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('8')">8</button>
            <button type="button" class="btn btn-sm btn-light col-2" onclick="insertar('9')">9</button>
            <button type="button" class="btn btn-sm btn-light col-1" onclick="insertar('^')">^</button>
            <button id="igual" type="button" class="btn btn-sm btn-outline-secondary col-1" onclick="declararCadena()">=</button>
        </div>
    </div>
    <div id="res" class="row justify-content-center pt-3 m-0">
        <button id="siguiente-b" class="col-1 btn btn-dark px-0 m-1" onclick="nuevoEstado()" disabled>Siguiente</button>
        <button id="animacion-b" class="col-1 btn btn-dark px-0 m-1" onclick="iniciarAnimacion()" disabled>Iniciar Animación</button>
    </div>
    <div class="col-13 row justify-content-center mx-auto pt-3 overflow-auto table-div">
        <div class="p-0 m-0">
            <table id="tabla-1" class="table table-bordered text-center mb-0"></table>
        </div>
        <div class="p-0 m-0">
            <table id="tabla-2" class="table mb-0"></table>
        </div>
    </div>
    <div>
        <table class="table table-borderless text-center mt-3">
            <tbody>
                <tr>
                    <td id="imgTabla" class="imageCol" style="background-color:  #f1f1f1;"><img src=""></td>
                    <td id="imgGrafo" class="imageCol" style="background-color:  #f1f1f1;"><img src=""></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
